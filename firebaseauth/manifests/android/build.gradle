dependencies {
    // Firebase Cloud Messaging, and nothing else.
    //
    // firebase-auth and play-services-auth were here for Google sign-in, which
    // no longer exists — authentication is the device id, and the phone number
    // when that is not enough, both over plain HTTP to our own backend.
    //
    // Pinned via the BoM so the messaging artifact and everything it pulls in
    // are a set that Google tested together; the versions do not move
    // independently.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
